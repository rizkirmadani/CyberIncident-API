openapi: 3.0.3
info:
  title: CyberIncident API
  version: 1.0.0
  description: Simulated cybersecurity incident reporting and tracking API.
servers:
  - url: http://127.0.0.1:5000/api/v1
paths:
  /health:
    get:
      summary: API health check
      responses:
        '200':
          description: API is running
  /users:
    get:
      summary: List users
      responses:
        '200':
          description: User list
    post:
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: {type: string}
                email: {type: string, format: email}
                role: {type: string, enum: [reporter, analyst, admin]}
      responses:
        '201': {description: User created}
        '400': {description: Invalid input}
  /assets:
    get:
      summary: List assets
      responses:
        '200': {description: Asset list}
    post:
      summary: Create asset
      responses:
        '201': {description: Asset created}
  /categories:
    get:
      summary: List incident categories
      responses:
        '200': {description: Category list}
    post:
      summary: Create incident category
      responses:
        '201': {description: Category created}
  /incidents:
    get:
      summary: List incidents (search, status, severity, page, per_page)
      parameters:
        - {name: search, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [open, investigating, resolved, closed]}}
        - {name: severity, in: query, schema: {type: string, enum: [low, medium, high, critical]}}
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: per_page, in: query, schema: {type: integer, default: 10, maximum: 100}}
      responses:
        '200': {description: Incident list and pagination metadata}
    post:
      summary: Report incident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, user_id, asset_id, category_id]
              properties:
                title: {type: string}
                description: {type: string}
                severity: {type: string, enum: [low, medium, high, critical]}
                status: {type: string, enum: [open, investigating, resolved, closed]}
                user_id: {type: integer}
                asset_id: {type: integer}
                category_id: {type: integer}
      responses:
        '201': {description: Incident created}
        '400': {description: Invalid input}
  /incidents/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      summary: Get incident detail
      responses:
        '200': {description: Incident detail}
        '404': {description: Not found}
    put:
      summary: Update incident
      responses:
        '200': {description: Updated}
    delete:
      summary: Delete incident
      responses:
        '200': {description: Deleted}
  /incidents/{id}/updates:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      summary: List incident updates
      responses:
        '200': {description: History list}
    post:
      summary: Add handling update
      responses:
        '201': {description: Update recorded}
